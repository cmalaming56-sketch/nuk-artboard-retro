<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuk Script Live Network v3.0</title>
    <style>
        body { margin: 0; padding: 0; background-color: #1a1a1a; color: #ffffff; font-family: sans-serif; }
        .header { text-align: center; padding: 20px; background: #111; border-bottom: 2px solid #00ffcc; }
        h1 { margin: 0; color: #00ffcc; font-size: 24px; }
        .main-container { display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .canvas-area { background: #fff; border: 3px dashed #00ffcc; border-radius: 4px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        canvas { display: block; cursor: crosshair; }
        .tools { margin-top: 15px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        button { padding: 8px 16px; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px; font-weight: bold; cursor: pointer; }
        button:hover { background: #00ffcc; color: #000; border-color: #00ffcc; }
        .board-container { max-width: 800px; margin: 30px auto; background: #222; padding: 20px; border-radius: 8px; border: 1px solid #333; }
        textarea { width: 100%; height: 70px; background: #333; color: #fff; border: 1px solid #555; padding: 10px; box-sizing: border-box; resize: none; border-radius: 4px; }
        .feed { margin-top: 10px; max-height: 400px; overflow-y: auto; background: #151515; padding: 15px; border-radius: 4px; border: 1px solid #2a2a2a; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🚀 Nuk-Artboard-Retro [Nuk Script Architecture V3.0 - Live Cloud]</h1>
        <p style="margin: 5px 0 0 0; color: #aaa; font-size: 13px;">เวอร์ชันเชื่อมโลก: ข้อมูลวาดภาพและฟีดข้อความเชื่อมถึงกันเรียลไทม์ข้ามฮาร์ดแวร์ 24 ชม.</p>
    </div>

    <div class="main-container">
        <div class="canvas-area">
            <canvas id="canvas" width="800" height="400"></canvas>
        </div>
        <div class="tools">
            <button id="toolPencil" onclick="setTool('pencil')" style="background:#00ffcc; color:#000; border:none;">✏️ ดินสอ</button>
            <button id="toolEraser" onclick="setTool('eraser')">🧼 ยางลบ</button>
            <button id="toolBucket" onclick="setTool('bucket')">🪣 ถังสี</button>
            🎨 สี: <input type="color" id="penColor" value="#1a1a1a" style="cursor:pointer;">
            📏 ขนาด: <input type="range" id="penSize" min="1" max="50" value="6" style="cursor:pointer;">
            <span id="sizeDisplay" style="color:#00ffcc; font-weight:bold;">6px</span>
            <button id="saveImgBtn" style="margin-left:20px;">💾 เซฟรูปภาพลง SSD</button>
            <button onclick="clearCanvas()" style="background:#522;">🧹 ล้างกระดาน</button>
        </div>
    </div>

    <div class="board-container">
        <h3>💬 กระดานโพสต์ฟีดแชร์ข้อมูลออนไลน์ (Global Live Sync)</h3>
        <textarea id="tweetText" placeholder="สหายอยากแชร์ข้อความอะไรลงฟีดโลก..."></textarea>
        <div style="margin-top:10px; display:flex; justify-content:space-between; align-items:center;">
            <div>🖼️ แนบไฟล์รูปภาพ: <input type="file" id="tweetImage" accept="image/*" style="color:#aaa;"></div>
            <button onclick="sendTweetToServer()" style="background:#00ffcc; color:#000; border:none; padding:10px 25px;">🚀 โพสต์ลงฟีดโลก</button>
        </div>
        <div style="margin-top:15px; text-align:right;">
            <button onclick="loadCloudTweets()" style="color:#00ffcc; border-color:#00ffcc; font-size:12px;">🔄 รีเฟรชดึงฟีดโลกสด</button>
        </div>
        <div class="feed" id="twitterFeed">
            <div style="padding:10px; color:#888; text-align:center;">กำลังเชื่อมต่อถังข้อมูลกลางไร้พรมแดน...</div>
        </div>
    </div>

    <script>
        const cvs = document.getElementById("canvas");
        const ctx = cvs.getContext("2d");
        let draw = false; 
        let currentTool = "pencil";
        
        function initCanvasBackground() { 
            ctx.fillStyle = "#ffffff"; 
            ctx.fillRect(0, 0, cvs.width, cvs.height); 
        }
        initCanvasBackground();
        
        const penSize = document.getElementById("penSize");
        const sizeDisplay = document.getElementById("sizeDisplay");
        penSize.addEventListener("input", (e) => { sizeDisplay.textContent = e.target.value + "px"; });
        
        function setTool(tool) {
            currentTool = tool;
            document.getElementById("toolPencil").style.background = (tool === "pencil") ? "#00ffcc" : "#333";
            document.getElementById("toolPencil").style.color = (tool === "pencil") ? "#000" : "#fff";
            document.getElementById("toolEraser").style.background = (tool === "eraser") ? "#00ffcc" : "#333";
            document.getElementById("toolEraser").style.color = (tool === "eraser") ? "#000" : "#fff";
            document.getElementById("toolBucket").style.background = (tool === "bucket") ? "#00ffcc" : "#333";
            document.getElementById("toolBucket").style.color = (tool === "bucket") ? "#000" : "#fff";
        }
        
        cvs.addEventListener("mousedown", () => {
            if (currentTool === "bucket") {
                ctx.fillStyle = document.getElementById("penColor").value;
                ctx.fillRect(0, 0, cvs.width, cvs.height);
            } else { draw = true; }
        });
        cvs.addEventListener("mouseup", () => { ctx.beginPath(); draw = false; });
        cvs.addEventListener("mousemove", (e) => {
            if(!draw || currentTool === "bucket") return;
            const r = cvs.getBoundingClientRect();
            ctx.lineWidth = penSize.value;
            ctx.lineCap = "round";
            ctx.strokeStyle = (currentTool === "eraser") ? "#ffffff" : document.getElementById("penColor").value;
            ctx.lineTo(e.clientX - r.left, e.clientY - r.top);
            ctx.stroke(); 
            ctx.beginPath(); 
            ctx.moveTo(e.clientX - r.left, e.clientY - r.top);
        });
        
        function clearCanvas() { ctx.clearRect(0, 0, cvs.width, cvs.height); initCanvasBackground(); }
        
        document.getElementById("saveImgBtn").addEventListener("click", () => {
            const link = document.createElement("a");
            link.download = "nuk-masterpiece.png";
            link.href = cvs.toDataURL("image/png");
            link.click();
        });

        const feed = document.getElementById("twitterFeed");
        const BIN_URL = "https://jsonbin.io";
        const API_KEY = "$2a$10$U9X4fXfB.1zU0rR1G2GkkuH1b8vN3XqWvK2l6X2pD1E3W4Y5Z6X7W";

        async function loadCloudTweets() {
            try {
                const res = await fetch(BIN_URL + "/latest", { headers: { "X-Master-Key": API_KEY } });
                const data = await res.json();
                if (data.record && data.record.htmlData) { feed.innerHTML = data.record.htmlData; }
            } catch (err) {
                feed.innerHTML = "<div style=\"color:#ff3333; padding:10px;\">🔴 ระบบเชื่อมต่อคลาวด์สะดุด กรุณากดปุ่มรีเฟรชค่ะ</div>";
            }
        }

        async function sendTweetToServer() {
            const txtInput = document.getElementById("tweetText");
            const imgInput = document.getElementById("tweetImage");
            if (!txtInput.value.trim() && imgInput.files.length === 0) return;
            const timeString = new Date().toLocaleString("th-TH");
            let imgHtml = "";
            
            const processPost = async (finalImgHtml) => {
                const newPostHtml = "<div style=\"padding:15px; border-bottom:1px solid #222; font-size:14px; line-height:1.5; background:#1e1e1e; margin-bottom:8px; border-radius:4px;\"><small style=\"color:#00ffcc;\">[" + timeString + " - นิรนามสหาย]</small><br>" + txtInput.value + finalImgHtml + "</div>";
                feed.insertAdjacentHTML("afterbegin", newPostHtml);
                await fetch(BIN_URL, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json", "X-Master-Key": API_KEY },
                    body: JSON.stringify({ htmlData: feed.innerHTML })
                });
                txtInput.value = ""; imgInput.value = "";
            };

            if (imgInput.files && imgInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imgHtml = "<br><img src=\"" + e.target.result + "\" style=\"max-width:100%; max-height:250px; margin-top:10px; border-radius:4px; border:1px solid #333;\">";
                    processPost(imgHtml);
                };
                reader.readAsDataURL(imgInput.files[0]);
            } else { processPost(""); }
        }
        
        loadCloudTweets();
        setInterval(loadCloudTweets, 20000);
    </script>
</body>
</html>
